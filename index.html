<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Gift For You 🎁</title>
<style>
:root{--bg1:#2a0a1f;--bg2:#5a1236;--gift:#e11d48;--lid:#be123c;--ribbon:#fde68a;--text:#fff}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg1));font-family:Georgia,'Times New Roman',serif;color:var(--text);display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
canvas{position:fixed;inset:0;pointer-events:none;z-index:2}
#hint{position:absolute;top:12%;width:100%;text-align:center;font-size:1.3rem;opacity:.9;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.4}}
#gift{position:relative;width:180px;height:180px;cursor:pointer;animation:bounce 1.4s infinite;z-index:1}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
#gift.open{animation:none}
.box{position:absolute;bottom:0;left:10px;width:160px;height:120px;background:var(--gift);border-radius:6px}
.box:after{content:"";position:absolute;left:68px;top:0;width:24px;height:100%;background:var(--ribbon)}
.lid{position:absolute;top:22px;left:0;width:180px;height:42px;background:var(--lid);border-radius:6px;transition:transform .8s ease,opacity .8s;transform-origin:left bottom}
.lid:after{content:"";position:absolute;left:78px;top:0;width:24px;height:100%;background:var(--ribbon)}
.lid:before{content:"🎀";position:absolute;left:70px;top:-34px;font-size:40px}
#gift.open .lid{transform:translateY(-120px) rotate(-25deg);opacity:0}
#card{position:absolute;max-width:min(88vw,460px);text-align:center;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:28px 22px;opacity:0;transform:scale(.6);transition:all .9s cubic-bezier(.2,1.4,.4,1);pointer-events:none;z-index:3}
#card.show{opacity:1;transform:scale(1)}
#card h1{margin:0 0 12px;font-size:2rem;color:var(--ribbon)}
#card p{margin:0;font-size:1.15rem;line-height:1.6}
.heart{position:fixed;bottom:-40px;color:#ef4444;z-index:1;pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="hint">Tap the gift 🎁</div>
<div id="gift" role="button" aria-label="Open the gift"><div class="box"></div><div class="lid"></div></div>
<div id="card">
  <h1>Congratulations! 💍</h1>
  <p>Wishing you a lifetime of love, laughter and happiness on your engagement. May this beautiful journey together be filled with joy, and may every day bring you closer. I'm so happy for you! ❤️</p>
</div>
<script>
var cv=document.getElementById('fx'),cx=cv.getContext('2d'),W,H,parts=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
size();addEventListener('resize',size);
var ac;
var chords=[[293.66,369.99,440,587.33],[277.18,329.63,440,554.37],[246.94,293.66,369.99,493.88],[277.18,369.99,440,554.37],[392,493.88,587.33,783.99],[293.66,369.99,440,587.33],[392,493.88,587.33,783.99],[277.18,329.63,440,554.37]];
var pat=[0,1,2,3,2,3,2,1];
function note(f,t){
  var o=ac.createOscillator(),g=ac.createGain();
  o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.12,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+.9);
  o.connect(g);g.connect(ac.destination);
  o.start(t);o.stop(t+.95);
}
function music(){
  var mi=0,nt=ac.currentTime+.1;
  function sched(){
    while(nt<ac.currentTime+.5){
      var ch=chords[Math.floor(mi/8)%chords.length];
      note(ch[pat[mi%8]],nt);
      nt+=.32;mi++;
    }
  }
  sched();setInterval(sched,200);
}
function pop(){
  if(!ac)return;
  var t=ac.currentTime;
  var o=ac.createOscillator(),og=ac.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(180,t);
  o.frequency.exponentialRampToValueAtTime(50,t+.3);
  og.gain.setValueAtTime(.35,t);
  og.gain.exponentialRampToValueAtTime(.001,t+.35);
  o.connect(og);og.connect(ac.destination);
  o.start(t);o.stop(t+.35);
  var cn=Math.floor(ac.sampleRate*.12),cb=ac.createBuffer(1,cn,ac.sampleRate),cd=cb.getChannelData(0);
  for(var j=0;j<cn;j++)cd[j]=(Math.random()*2-1)*Math.pow(1-j/cn,4);
  var cs=ac.createBufferSource();cs.buffer=cb;
  var cf=ac.createBiquadFilter();cf.type='highpass';cf.frequency.value=1200;
  var cg=ac.createGain();cg.gain.value=.7;
  cs.connect(cf);cf.connect(cg);cg.connect(ac.destination);
  cs.start(t);
  var n=Math.floor(ac.sampleRate*1),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++){d[i]=Math.random()<.012?(Math.random()*2-1)*Math.pow(1-i/n,1.5):0;}
  var s=ac.createBufferSource();s.buffer=b;
  var f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=3500;
  var g=ac.createGain();g.gain.value=.5;
  s.connect(f);f.connect(g);g.connect(ac.destination);
  s.start(t+.1);
}
function burst(x,y){
  var hue=Math.random()*360;
  for(var i=0;i<60;i++){
    var a=Math.random()*6.283,s=Math.random()*5+1;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:70,c:'hsl('+(hue+Math.random()*40)+',100%,60%)'});
  }
}
function loop(){
  cx.clearRect(0,0,W,H);
  parts=parts.filter(function(p){return p.l>0});
  parts.forEach(function(p){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.l--;
    cx.globalAlpha=p.l/70;cx.fillStyle=p.c;
    cx.beginPath();cx.arc(p.x,p.y,2.5,0,6.283);cx.fill();
  });
  requestAnimationFrame(loop);
}
loop();
function hearts(){
  var set=['❤️','💖','💕','❤️','💗'];
  setInterval(function(){
    var h=document.createElement('div');
    h.className='heart';
    h.textContent=set[Math.floor(Math.random()*set.length)];
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=(16+Math.random()*28)+'px';
    h.style.animationDuration=(4+Math.random()*4)+'s';
    document.body.appendChild(h);
    setTimeout(function(){h.remove()},8500);
  },250);
}
var opened=false;
document.getElementById('gift').addEventListener('click',function(){
  if(opened)return;opened=true;
  try{ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();music();}catch(e){}
  this.classList.add('open');
  document.getElementById('hint').style.display='none';
  setTimeout(function(){
    document.getElementById('gift').style.display='none';
    document.getElementById('card').classList.add('show');
  },700);
  burst(W/2,H/2);
  setInterval(function(){burst(Math.random()*W,Math.random()*H*.6+20)},700);
  hearts();
});
</script>
</body>
</html>
